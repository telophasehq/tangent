[package]
name = "tangent-compact-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1.0"
serde_yaml = "0.9.34"
tangent-compact = { path = ".." }

# not a member of the tangent workspace: `cargo +nightly fuzz run <target>` from crates/compact
[workspace]

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
