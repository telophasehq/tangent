runtime:
  plugins_path: "plugins/"
plugins:
  npmpackageupdates:
    module_type: go
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  npm_registry:
    type: npm_registry
    # Public packages need no npm account or token. These three publish most
    # days, so a first run usually has something to show.
    packages:
      - "@anthropic-ai/claude-code"
      - "@cloudflare/workers-types"
      - "@google/gemini-cli"
    # Each poll downloads every package's full registry document (a few MB).
    interval_secs: 300
sinks:
  alerts:
    type: file
    path: alerts.ndjson
    compression:
      type: none
dag:
  - from: npm_registry
    to: [npmpackageupdates]

  - from: npmpackageupdates
    to: [alerts]
