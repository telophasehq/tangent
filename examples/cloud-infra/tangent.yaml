# cloud-infra: your own infrastructure's logs, each record folded into its
# actor's history in state.sqlite and kept in the lake, and each actor's
# records judged a group at a time on workers of their own, so ingest never
# waits on the model. One config, one process.
#
#   make setup      the enrichment data (GeoLite2, cloud ranges, Tor exits)
#   make test       the packs' plugins, then their fixtures; no model needed
#   make run        reads CloudTrail, GitHub, Okta and Workspace for the credentials you
#                   export (see the Makefile), NDJSON on :9400 for the rest, and judges them
#
# Edit profile/profile.yaml first: it is everything the model knows about you.
include:
  - ../../packs/judge/ingest.yaml             # the judge, and the enrich and behavior-baseline packs it includes
  - ../../packs/aws/ingest.yaml               # plugin aws: cloudtrail
  - ../../packs/github/ingest.yaml            # plugin github: github_audit, gha_ci, runner_egress
  - ../../packs/okta/ingest.yaml              # plugin okta: okta
  - ../../packs/google_workspace/ingest.yaml  # plugin google_workspace: google_workspace
  - ../../packs/app/ingest.yaml               # plugin app: app, agent

enrichment_tables:
  profile: { type: document, path: profile/profile.yaml, required: true }   # a typo here stops it

# JSON lines instead, at three times the tokens (packs/core/README.md):
# inference:
#   judge:
#     batch_bytes: 48000
#     encoding:
#       type: ndjson

sinks:
  lake:                          # every finished record, kept: Parquet files, a directory an hour; delete old hours to trim it
    type: rolling_file
    path: lake/logs/%Y/%m/%d/%H
    wal_path: lake/wal
    max_file_age_seconds: 3600
    compression: { type: zstd, level: 3 }
    encoding:
      type: parquet
      record_column: record      # each record whole, for the fields the schema leaves out
      schema:
        ts: timestamp
        source: string
        _norm: { org: string, actor: string, kind: string, ip: string }
  # What flagged keeps, to Slack too, with its edge at the end of `dag` (packs/core/README.md#slack):
  # slack:
  #   type: slack
  #   webhook_url: ${SLACK_WEBHOOK_URL}
  #   text: "*{_norm.actor}* {_norm.kind|eventName|eventType|action|event|step|events.0.name} from {_norm.ip|sourceIPAddress|client.ipAddress|ipAddress|actor_ip|ip|client_ip}: {judge.why|not judged: judge.error}"

sources:
  cloudtrail:
    type: cloudtrail
    region: ${AWS_REGION}
    profile: ${AWS_PROFILE}
    queue_url: ${CLOUDTRAIL_QUEUE_URL}
    bucket_role: ${CLOUDTRAIL_BUCKET_ROLE}
  github_audit:
    type: github_audit
    org: ${GITHUB_ORG}
    token: ${GITHUB_TOKEN}
  okta_audit:
    type: okta
    org_url: ${OKTA_ORG_URL}
    token: ${OKTA_API_TOKEN}
  workspace_audit:
    type: google_workspace
    credentials_file: ${GOOGLE_APPLICATION_CREDENTIALS}
    subject: ${GOOGLE_ADMIN_EMAIL}
  events:
    type: tcp
    bind_address: 0.0.0.0:9400

dag:
  - from: cloudtrail
    to: [aws]
  - from: github_audit
    to: [github]
  - from: okta_audit
    to: [okta]
  - from: workspace_audit
    to: [google_workspace]
  # NDJSON, each record's `source` naming its shape: each pack takes its own
  # (gha_ci and runner_egress are github's, app and agent app's), and a record
  # no pack takes is dropped, with a warning.
  - from: events
    to:
      - aws
      - github
      - okta
      - google_workspace
      - app
  # Each pack's records: kept in the lake, folded into the actor's baseline,
  # and judged (packs/core).
  - from: aws
    to: [lake, baseline_builder, baseline_renderer]
  - from: github
    to: [lake, baseline_builder, baseline_renderer]
  - from: okta
    to: [lake, baseline_builder, baseline_renderer]
  - from: google_workspace
    to: [lake, baseline_builder, baseline_renderer]
  - from: app
    to: [lake, baseline_builder, baseline_renderer]
  # - from: flagged   # to Slack, with `slack` above
  #   to: [slack]
