# Your company, as the pipeline needs to know it. Every line here is a fact
# about you that no log carries: who your people are, where they are, where
# your services run, which hosts your systems talk to, which assets matter.
#
# The values below describe the fictional company in cases/, so `make test`
# passes out of the box. Replace them with yours before `make run`.

org: acme                        # the org every one of your own infrastructure logs is folded into
own_sources: [cloudtrail, github_audit, okta, google_workspace, gha_ci, runner_egress]

countries: [US]                  # where your people sign in from
cloud: aws                       # where your services run (aws, gcp, cloudflare, datacenter); a service seen elsewhere is news
networks: [10.0.0.0/8]           # your own addresses (office, VPN, CI egress): never a person's odd location

members:                         # people: identity-provider emails and GitHub handles
  - admin@acme.io
  - alice@acme.io
  - bob@acme.io
  - carol@acme.io
  - cfo@acme.io
  - dave@acme.io
  - erin@acme.io
  - grace@acme.io
  - oncall-frank@acme.io
  - dave
  - dev-mallory
  - dev-sam
  - eve
  - grace
  - "dependabot[bot]"

services:                        # service principals: IAM users and roles, deploy bots, backup users
  - deploy-bot
  - prod-readonly
  - svc-backup2
  - railway-deploy
  - agent-plan-worker

people:                          # one person under each name the sources give them: IAM users, GitHub handles
  dave@acme.io: [dave]
  grace@acme.io: [grace]

about:                           # who an actor is, when its name does not say
  VendorAuditRole: "the compliance vendor: reads IAM, credential reports and backups every day"

keys:                            # API keys and the networks each calls from
  ak_1a1: [165.227.44.19]        # the findings poller
  ak_rail: [35.212.0.0/16]       # the service hosted at a vendor
  ak_drift: [52.94.76.0/24]      # an integration, from the vendor's AWS range
  ak_c4d: [54.240.197.233]       # a customer's key, from their one AWS address

hosts:                           # hosts your systems talk to (*.suffix allowed)
  - api.github.com
  - github.com
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - ghcr.io
  - sts.amazonaws.com
  - vault.acme.internal
  - "*.acme.internal"
  - api.anthropic.com
  - api.postmarkapp.com

sensitive:                       # buckets, repos, tables a person should hear about every time
  - acme-customer-exports
  - prod-db

watch:                           # kinds a person wants seen every time, however usual
  - StopLogging                        # CloudTrail
  - DeleteTrail
  - PutBucketPolicy
  - PutBucketPublicAccessBlock
  - AuthorizeSecurityGroupIngress
  - ModifyDBSnapshotAttribute
  - CreateUser
  - CreateAccessKey
  - AttachUserPolicy
  - user.mfa.factor.deactivate         # Okta
  - system.api_token.create
  - protected_branch.destroy           # GitHub audit log
  - deploy_key.create
  - org.update_member
  - org.self_hosted_runner_register
  - repo.rename
  - repo.access
  - pull_request_target
  - EMAIL_FORWARDING_OUT_OF_DOMAIN     # Google Workspace
  - member.role.changed                # the product's own audit log
  - org.settings.changed
  - api_key.create
  - org.export.started
  - aws_api_call                       # the AI agent
  - step_failed
