# cloud-infra, judge: packs/core's judge over logs.sqlite, each pack's
# records written as its judge.yaml says once the encoding is logfmt.
include:
  - ../../packs/core/judge.yaml
  - ../../packs/aws/judge.yaml
  - ../../packs/github/judge.yaml
  - ../../packs/okta/judge.yaml
  - ../../packs/google_workspace/judge.yaml
  - ../../packs/app/judge.yaml

