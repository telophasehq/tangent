# cloud-infra, judge: packs/core's judge over logs.sqlite, with each actor's
# history from ingest's state.sqlite (start ingest first), each pack's records
# written as logfmt as its judge.yaml says.
include:
  - ../../packs/core/judge.yaml
  - ../../packs/aws/judge.yaml
  - ../../packs/github/judge.yaml
  - ../../packs/okta/judge.yaml
  - ../../packs/google_workspace/judge.yaml
  - ../../packs/app/judge.yaml

# JSON lines instead, at three times the tokens (packs/core/README.md):
# inference:
#   judge:
#     batch_bytes: 48000
#     encoding:
#       type: ndjson

# What flagged keeps, to Slack too (README.md):
# sinks:
