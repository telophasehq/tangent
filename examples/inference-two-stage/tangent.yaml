# The same inference node twice. A small model on this machine answers one word
# about every record; a plugin keeps the yeses; a stronger model writes the full
# verdict on those; a plugin keeps what it flagged.
#
#   mlx_lm.server --model mlx-community/GLM-4.7-Flash-4bit --port 8080
#   aws sso login --profile <your-profile>
#   tangent plugin compile --config tangent.yaml
#   tangent run --config tangent.yaml
#   nc localhost 9000 < events.ndjson
#   cat flagged.ndjson
runtime:
  workers: 1
  plugins_path: plugins/

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9000

inference:
  first_pass:
    backend: openai
    url: http://localhost:8080/v1
    model: mlx-community/GLM-4.7-Flash-4bit
    prompt_file: first_pass.md
    answer: yes_no                  # one word, landing as _first_pass.answer
    concurrency: 8
    max_tokens: 8                   # the answer is one token; a reasoning model would need ~100
    extra:
      chat_template_kwargs:
        enable_thinking: false

  judge:
    backend: bedrock
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    region: us-west-2
    prompt_file: judge.md           # the full verdict, landing as _judge
    concurrency: 8
    timeout_ms: 30000

plugins:
  keep_yes:                         # _first_pass.answer == "yes", or the first pass could not answer
    module_type: rust
    path: keep_yes
  flagged:                          # _judge.flag == true, or the judge could not read the reply
    module_type: rust
    path: ../inference-local/flagged

sinks:
  flagged:
    type: file
    path: flagged.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: events }
    to: [{ kind: inference, name: first_pass }]
  - from: { kind: inference, name: first_pass }
    to: [{ kind: plugin, name: keep_yes }]
  - from: { kind: plugin, name: keep_yes }
    to: [{ kind: inference, name: judge }]
  - from: { kind: inference, name: judge }
    to: [{ kind: plugin, name: flagged }]
  - from: { kind: plugin, name: flagged }
    to: [{ kind: sink, name: flagged }]
