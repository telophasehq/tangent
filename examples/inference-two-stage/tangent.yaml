# The same inference node twice. A small model on this machine answers one word
# about every record; only the yeses reach a stronger model, which writes the
# full verdict. Different model, different prompt, different output; one node.
#
#   mlx_lm.server --model mlx-community/GLM-4.7-Flash-4bit --port 8080
#   aws sso login --profile <your-profile>
#   tangent run --config tangent.yaml
#   nc localhost 9000 < events.ndjson
#   cat flagged.ndjson
runtime:
  workers: 1

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9000

inference:
  first_pass:
    backend: openai
    url: http://localhost:8080/v1
    model: mlx-community/GLM-4.7-Flash-4bit
    prompt_file: first_pass.md
    answer: yes_no                  # one word: yes forwards, no drops, anything else is an error
    output: _first_pass             # {"answer": "yes"} on the records that go on
    concurrency: 8
    max_tokens: 8                   # the answer is one token; a reasoning model would need ~100
    extra:
      chat_template_kwargs:
        enable_thinking: false

  verdict:
    backend: bedrock
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    region: us-west-2
    prompt_file: verdict.md
    output: _verdict
    forward_if: flag                # the second model can still say no
    concurrency: 8
    timeout_ms: 30000

sinks:
  flagged:
    type: file
    path: flagged.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: events }
    to: [{ kind: inference, name: first_pass }]
  - from: { kind: inference, name: first_pass }
    to: [{ kind: inference, name: verdict }]
  - from: { kind: inference, name: verdict }
    to: [{ kind: sink, name: flagged }]
