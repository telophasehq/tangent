# A model reads every record and only what it flags goes on.
#
#   tangent run --config tangent.yaml
#   nc localhost 9000 < events.ndjson
#   cat flagged.ndjson
#
# Needs an OpenAI-compatible server. On a Mac with mlx_lm:
#   mlx_lm.server --model mlx-community/GLM-4.7-Flash-4bit --port 8080
runtime:
  workers: 1

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9000

processors:
  judge:
    type: inference
    url: http://localhost:8080/v1
    model: mlx-community/GLM-4.7-Flash-4bit
    prompt_file: judge.md
    output: _judge          # the model's reply lands here
    forward_if: flag        # only records the model flags go on
    concurrency: 1          # one request at a time on a laptop GPU
    timeout_ms: 120000
    extra:
      chat_template_kwargs:
        enable_thinking: false   # mlx_lm: answer in seconds, not minutes

sinks:
  flagged:
    type: file
    path: flagged.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: events }
    to: [{ kind: processor, name: judge }]
  - from: { kind: processor, name: judge }
    to: [{ kind: sink, name: flagged }]
