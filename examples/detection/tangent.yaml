runtime:
  plugins_path: "plugins/"
plugins:
  detection:
    module_type: go
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  network_input:
    type: tcp
    bind_address: 0.0.0.0:9000
sinks:
  out:
    type: file
    path: out.ndjson
    compression:
      type: none
dag:
  - from: network_input
    to: [detection]

  - from: detection
    to: [out]
