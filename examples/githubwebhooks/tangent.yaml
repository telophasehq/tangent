runtime:
  plugins_path: "plugins/"
plugins:
  githubwebhooks:
    module_type: go
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  github:
    type: github_webhook
    bind_address: 0.0.0.0:9000
    path: /webhook
    token: "${GITHUB_TOKEN}"  
sinks:
  blackhole:
    type: blackhole
dag:
  - from: github
    to: [githubwebhooks]

  - from: githubwebhooks
    to: [blackhole]