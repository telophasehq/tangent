[workspace]
members = [ "crates/bench","crates/tangent", "crates/compile-wasm", "crates/shared", "crates/cli", "crates/compact"]
resolver = "2"

[workspace.dependencies]
prometheus = "0.13.4"
prometheus_exporter = "0.8.5"
lazy_static = "1"
# The 48 line is wasmtime's long-term-support release: patch releases for two years.
wasmtime      = "48.0.8"
wasmtime-wasi = "48.0.8"

[workspace.package]
version = "0.1.9"
edition = "2021"
repository = "https://github.com/EthanBlackburn/tangent"
homepage = "https://github.com/EthanBlackburn/tangent"
documentation = "https://github.com/EthanBlackburn/tangent"
readme = "README.md"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = 2                    
strip = "none"               
split-debuginfo = "unpacked"
lto = "off"                  
codegen-units = 1             
opt-level = 3              
panic = "unwind"

[profile.profiling.package."*"]
debug = 2
