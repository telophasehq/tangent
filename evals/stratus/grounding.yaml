# What the pipeline should catch in AWS, grounded in Stratus Red Team's
# techniques (v2.37.0, techniques.json and logs/ from fetch.py).
#
# decides: what a judge needs to tell the attack from ordinary work
#   event   one record, read with its parameters, is enough
#   actor   the call is routine for someone; who made it, from where, and
#           whether they usually do is what decides
#   volume  many calls in minutes; the count is the signal
#   data    needs S3 data events, which LookupEvents never returns and a
#           trail logs only when they are turned on
# cases: our corpus' cases that exercise the same calls (a `negative/` case
# is the benign twin).

aws.credential-access.ec2-get-password-data:        {decides: volume, cases: []}
aws.credential-access.ec2-steal-instance-credentials: {decides: actor, note: an instance role's session used from an address outside the instance}
aws.credential-access.secretsmanager-batch-retrieve-secrets: {decides: event, note: BatchGetSecretValue is rare outside tooling}
aws.credential-access.secretsmanager-retrieve-secrets: {decides: volume, cases: [ai-agent/agent-escapes-task-uses-found-credentials]}
aws.credential-access.ssm-retrieve-securestring-parameters: {decides: volume}

aws.defense-evasion.cloudtrail-delete:               {decides: event}
aws.defense-evasion.cloudtrail-event-selectors:      {decides: event, note: the selectors in the request turn logging off}
aws.defense-evasion.cloudtrail-lifecycle-rule:       {decides: event, note: a short expiry on the trail's own bucket}
aws.defense-evasion.cloudtrail-stop:                 {decides: event, cases: [cloud/cloudtrail-stop-logging]}
aws.defense-evasion.dns-delete-logs:                 {decides: event}
aws.defense-evasion.organizations-leave:             {decides: event}
aws.defense-evasion.vpc-remove-flow-logs:            {decides: event}

aws.discovery.ec2-download-user-data:                {decides: volume}
aws.discovery.ec2-enumerate-from-instance:           {decides: volume, note: no recorded logs}
aws.discovery.ses-enumerate:                         {decides: volume, note: no recorded logs}

aws.execution.ec2-launch-unusual-instances:          {decides: actor, note: an instance type the org never runs}
aws.execution.ec2-user-data:                         {decides: event, note: stop, rewrite user data, start}
aws.execution.sagemaker-update-lifecycle-config:     {decides: actor, note: no recorded logs}
aws.execution.ssm-send-command:                      {decides: actor}
aws.execution.ssm-start-session:                     {decides: actor}

aws.exfiltration.ec2-security-group-open-port-22-ingress: {decides: event, cases: [cloud/sg-open-world]}
aws.exfiltration.ec2-share-ami:                      {decides: event}
aws.exfiltration.ec2-share-ebs-snapshot:             {decides: event}
aws.exfiltration.rds-share-snapshot:                 {decides: event, cases: [data/snapshot-shared-external]}
aws.exfiltration.s3-backdoor-bucket-policy:          {decides: event, cases: [cloud/s3-bucket-public], note: no recorded logs; ours is a public bucket, not one shared with another account}

aws.impact.bedrock-invoke-model:                     {decides: actor, note: model access enabled and models invoked by a principal that never used Bedrock; volume too}
aws.impact.ec2-deregister-ami:                       {decides: actor, note: no recorded logs}
aws.impact.s3-ransomware-batch-deletion:             {decides: data, note: no recorded logs}
aws.impact.s3-ransomware-client-side-encryption:     {decides: data, note: no recorded logs}
aws.impact.s3-ransomware-individual-deletion:        {decides: data, note: no recorded logs}

aws.initial-access.console-login-without-mfa:        {decides: event, cases: [cloud/root-console-login], note: ours is root's sign-in; this is an IAM user's without MFA}

aws.lateral-movement.ec2-instance-connect:           {decides: actor}
aws.lateral-movement.ec2-serial-console-send-ssh-public-key: {decides: event}

aws.persistence.ec2-create-suspicious-keypair:       {decides: actor, note: no recorded logs}
aws.persistence.iam-backdoor-role:                   {decides: event, note: a trust policy that admits another account}
aws.persistence.iam-backdoor-user:                   {decides: actor, cases: [negative/secret-rotation-after-vendor-notice], note: a second access key on an existing user; a rotation is the same call}
aws.persistence.iam-create-admin-user:               {decides: event, cases: [cloud/iam-key-create-attach-star-then-use]}
aws.persistence.iam-create-backdoor-role:            {decides: event}
aws.persistence.iam-create-user-login-profile:       {decides: actor}
aws.persistence.lambda-backdoor-function:            {decides: event, note: invoke permission for any principal}
aws.persistence.lambda-layer-extension:              {decides: event, note: a layer from another account}
aws.persistence.lambda-overwrite-code:               {decides: actor, note: a deploy is the same call}
aws.persistence.rolesanywhere-create-trust-anchor:   {decides: event}
aws.persistence.sts-federation-token:                {decides: actor}

aws.privilege-escalation.iam-update-user-login-profile: {decides: event, note: one user setting another's console password}
