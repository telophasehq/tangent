# The corpus' company, acme, as the replay eval knows it (maincfg.py copies it
# into each WORK). examples/cloud-infra/profile/profile.yaml, plus what
# stream.py v3's ordinary days add: each member's IAM Identity Center username
# (in `members:`, and in `people:` beside the GitHub handles), admin's IAM
# user, and the office among `networks`; and the roles the Stratus techniques'
# warm-up made, as acme's own (stratus/splice.py's WARM_UP), which stream.py
# gives ordinary days. Edit here for the eval, not in the example.

org: acme                        # the org every one of your own infrastructure logs is folded into
own_sources: [cloudtrail, github_audit, okta, google_workspace, gha_ci, runner_egress]

countries: [US]                  # where your people sign in from
cloud: aws                       # where your services run (aws, gcp, cloudflare, datacenter); a service seen elsewhere is news
networks: [10.0.0.0/8, 73.162.14.9]   # acme's own addresses: the VPC and the office

members:                         # people: identity-provider emails and GitHub handles
  - admin@acme.io
  - alice@acme.io
  - bob@acme.io
  - carol@acme.io
  - cfo@acme.io
  - dave@acme.io
  - erin@acme.io
  - grace@acme.io
  - oncall-frank@acme.io
  - dave
  - dev-mallory
  - dev-sam
  - eve
  - grace
  - "dependabot[bot]"
  - admin
  - alice
  - bob
  - carol
  - cfo
  - erin
  - oncall-frank

services:                        # service principals: IAM users and roles, deploy bots, backup users
  - deploy-bot
  - prod-readonly
  - svc-backup2
  - svc-archive
  - etl-runner
  - railway-deploy
  - agent-plan-worker
  - ec2-support
  - org-admin
  - web-instance
  - lambda-exec
  - fleet-anywhere

people:                          # one person under each name the sources give them: IAM users, GitHub handles, IdC usernames
  admin@acme.io: [admin]
  alice@acme.io: [alice]
  bob@acme.io: [bob]
  carol@acme.io: [carol]
  cfo@acme.io: [cfo]
  dave@acme.io: [dave]
  erin@acme.io: [erin]
  grace@acme.io: [grace]
  oncall-frank@acme.io: [oncall-frank]

about:                           # who an actor is, when its name does not say
  VendorAuditRole: "the compliance vendor: reads IAM, credential reports and backups every day"
  ec2-support: "the role members assume from the office to look at EC2"
  org-admin: "the nightly org inventory's role: lists the organization's accounts"
  web-instance: "the web tier's EC2 instance role: checks in with SSM from the VPC"
  lambda-exec: "the Lambda functions' execution role"
  fleet-anywhere: "IAM Roles Anywhere's role for the data-center hosts"

keys:                            # API keys and the networks each calls from
  ak_1a1: [165.227.44.19]        # the findings poller
  ak_rail: [35.212.0.0/16]       # the service hosted at a vendor
  ak_drift: [52.94.76.0/24]      # an integration, from the vendor's AWS range
  ak_c4d: [54.240.197.233]       # a customer's key, from their one AWS address

hosts:                           # hosts your systems talk to (*.suffix allowed)
  - api.github.com
  - github.com
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - ghcr.io
  - sts.amazonaws.com
  - vault.acme.internal
  - "*.acme.internal"
  - api.anthropic.com
  - api.postmarkapp.com

sensitive:                       # buckets, repos, tables a person should hear about every time
  - acme-customer-exports
  - prod-db

watch:                           # kinds a person wants seen every time, however usual
  - StopLogging                        # CloudTrail
  - DeleteTrail
  - PutBucketPolicy
  - PutBucketPublicAccessBlock
  - AuthorizeSecurityGroupIngress
  - ModifyDBSnapshotAttribute
  - CreateUser
  - CreateAccessKey
  - AttachUserPolicy
  - user.mfa.factor.deactivate         # Okta
  - system.api_token.create
  - protected_branch.destroy           # GitHub audit log
  - deploy_key.create
  - org.update_member
  - org.self_hosted_runner_register
  - repo.rename
  - repo.access
  - pull_request_target
  - EMAIL_FORWARDING_OUT_OF_DOMAIN     # Google Workspace
  - member.role.changed                # the product's own audit log
  - org.settings.changed
  - api_key.create
  - org.export.started
  - aws_api_call                       # the AI agent
  - step_failed
