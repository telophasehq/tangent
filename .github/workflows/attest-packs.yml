# The packs' components on a release come with their build's attestation,
# which `tangent plugin fetch` checks before it keeps one. dist's release
# workflow calls this once the release exists (dist-workspace.toml's
# publish-jobs), with the components the run built: each is attested here,
# with GitHub's artifact attestations, and the attestation bundle is uploaded
# to the release beside each component as <asset>.sigstore.json, so a check
# needs no GitHub login:
#
#   gh attestation verify aws.component.wasm --repo EthanBlackburn/tangent \
#     --bundle aws.component.wasm.sigstore.json --source-ref refs/tags/<tag> \
#     --signer-workflow EthanBlackburn/tangent/.github/workflows/attest-packs.yml
#
# The actions are pinned by commit: a moved tag is how tj-actions was turned.
name: Attest the packs
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan, for the release's tag
        required: true
        type: string

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the bundles onto the release
      id-token: write        # to sign as this workflow
      attestations: write    # to store the attestations
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - name: Fetch the components this run built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Attest them
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.component.wasm
      - name: Upload the bundle beside each component
        run: |
          set -euo pipefail
          ls artifacts/*.component.wasm
          for c in artifacts/*.component.wasm; do
            cp "$BUNDLE" "$c.sigstore.json"
          done
          gh release upload "$TAG" artifacts/*.component.wasm.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
