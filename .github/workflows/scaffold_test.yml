name: Scaffold services and run tests

on:
  pull_request:

jobs:
  scaffold-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tangent CLI
        run: cargo install --path crates/cli --locked

      - name: Scaffold Go plugin
        run: tangent plugin scaffold --name goplugin --lang go --setup

      - name: Scaffold Python plugin
        run: tangent plugin scaffold --name pyplugin --lang python --setup
      
      - name: Scaffold Rust plugin
        run: tangent plugin scaffold --name rustplugin --lang rust --setup

      - name: Run make test (Go)
        run: make test
        working-directory: goplugin

      - name: Run make test (Python)
        run: make test
        working-directory: pyplugin
      
      - name: Run make test (Rust)
        run: make test
        working-directory: rustplugin

      # A stateful plugin: per-org keys, and a transaction for a read and its write.
      - name: Run make test (examples/counter)
        run: make test
        working-directory: examples/counter

      # A plugin reading reference files from its data directory (plugins.<name>.data).
      - name: Run make test (examples/enrich)
        run: make test
        working-directory: examples/enrich

      # The config loader: include, merging, paths; and every config in the repo loads.
      - name: Run cargo test (tangent-shared)
        run: cargo test -p tangent-shared --locked

      # Every pack through include, with core and a profile; no model needed for the
      # test. Compiled here: a tangent built from a checkout has no release to fetch from.
      - name: Run make test (examples/cloud-infra)
        run: make test PLUGINS=compile
        working-directory: examples/cloud-infra

      - name: Run make test (examples/app-log)
        run: make test PLUGINS=compile
        working-directory: examples/app-log

      # Each pack alone, so none leans on another's files; and the libraries they share.
      - name: Run make test (packs)
        run: make -C packs test

      # The release builds every plugin the configs mark prebuilt: the list it builds from agrees with them.
      - name: Check the packs' release list
        run: packs/dist.sh check

      - name: Merge and check the examples' configs
        run: |
          for c in examples/cloud-infra/tangent.yaml examples/app-log/tangent.yaml; do
            tangent config --config "$c" > /dev/null
          done
