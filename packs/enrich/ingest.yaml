# enrich: the tables every pack's plugin reads. Not a provider: include it,
# with the packs you want, in your config, which names your sources, routes
# each to its pack and each pack's plugin on to where its records go, and
# gives the `profile` table (README.md).

# Read once for the process and shared by every pack's plugin, however many are
# included. examples/enrich/setup.sh fetches them; a missing file is a warning,
# and its fields are left out.
enrichment_tables:
  geo: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-Country.mmdb }
  asn: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-ASN.mmdb }
  networks: { type: cidr, path: ../../examples/enrich/data/networks.csv }
