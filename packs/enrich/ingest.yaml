# enrich: the tables every pack's plugin reads, and where its records go.
# Not a provider: include it, with the packs you want, in your config, which
# names your sources, routes each to its pack and each pack's plugin on to
# `lake`, and gives the `profile` table (README.md).

# Read once for the process and shared by every pack's plugin, however many are
# included. examples/enrich/setup.sh fetches them; a missing file is a warning,
# and its fields are left out.
enrichment_tables:
  geo: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-Country.mmdb }
  asn: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-ASN.mmdb }
  networks: { type: cidr, path: ../../examples/enrich/data/networks.csv }

# The state store, as behavior-baseline's file sets it: nothing expires unless
# its writer says when, and no TTL is capped. A polling source remembers each
# event it sent for three times its lateness, three hours for google_workspace.
# Under the runtime's default cap of an hour it would forget them while its
# polls still read them, and send them again.
runtime:
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

# Your config routes each pack's plugin to it.
sinks:
  lake:                          # every finished record, kept: Parquet files, a directory an hour; delete old hours to trim it
    type: rolling_file
    path: lake/logs/%Y/%m/%d/%H
    wal_path: lake/wal
    max_file_age_seconds: 3600
    compression: { type: zstd, level: 3 }
    encoding:
      type: parquet
      record_column: record      # each record whole, for the fields the schema leaves out
      schema:
        ts: timestamp
        source: string
        _norm: { org: string, actor: string, kind: string, ip: string }
