# macos, judge: how the judge writes a Mac's records as logfmt, the encoding
# packs/core/judge.yaml sets: one program's records together, what they share
# written once, and on every line the event, the file, the command line and
# the groups the file is in. Include it in a judge config with
# packs/core/judge.yaml, and make that config's `inference.judge.prompt_file`
# this directory's judge.md: core's brief is written for a company's cloud,
# and what is ordinary on a developer's Mac is in this one
# (examples/macos/judge.yaml).
inference:
  judge:
    encoding:
      sources:
        macos:
          principal: [_norm.actor]
          time: [ts]
          keep: [event, file, access, from, modified, detail, exec.args, exec.cwd, exec.script, exec.env, parents, process.pid, process.ppid, process.tty, _facts.credentials, _facts.agent_settings, _facts.agent_instructions, _facts.agent_mcp, _facts.agent_state, _facts.agent_extensions, _facts.persistence, _facts.agent_env, _facts.scratch_program, _facts.unsigned, _facts.rename_over]
