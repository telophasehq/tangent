# macos: eslogger's events from a Mac into finished records, by one plugin,
# `macos`: every program run (its environment cut to the names that steer an
# AI agent), and the writes and telling reads on an agent's settings,
# instructions, MCP config, transcripts and plugins, on credentials and on
# what runs at login; the rest dropped. Include it in an ingest config with
# packs/core/ingest.yaml and route a socket source to plugin macos:
# examples/macos has the lines.
runtime:
  # The plugin builds the process tree from fork, exec and exit, in order.
  # Without a `partition` (core allows none) the workers take records in
  # turn, so one process's fork and exec would race: one worker keeps them
  # in order, for the whole ingest this is included in.
  workers: 1
plugins:
  macos:
    module_type: rust
    path: .
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
    tests:
      - input: tests/input.json
        expected: tests/expected.json

dag:
  - from: { kind: plugin, name: macos }
    to: [{ kind: sink, name: logs }, { kind: sink, name: lake }, { kind: plugin, name: baseline_builder }]   # packs/core/ingest.yaml's: the judge's queue, the lake, each program's baseline
