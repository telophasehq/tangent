# cloud-infra: your own infrastructure's logs. Every record is kept; a model
# reads the ones that matter (something its actor or the org has not done in
# thirty days, the hour after it, and what the profile says to see every
# time), in batches, each with its history, and writes a verdict; a person
# reads the ones it flagged. No rule decides a verdict.
#
#   make setup      toolchain and the enrichment data (GeoLite2, cloud ranges, Tor exits)
#   make test       eight of the cases through norm, facts and novel; no model needed
#   make run        the pipeline: reads CloudTrail, GitHub, Okta and Workspace for the credentials
#                   you export (see the Makefile); anything else as NDJSON on :9400
#
# Edit profile/profile.yaml first: it is everything the models know about you.
runtime:
  workers: 2
  plugins_path: plugins/
  partition:
    key: [_norm.org]
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

sources:
  cloudtrail:
    type: cloudtrail
    region: ${AWS_REGION}
    profile: ${AWS_PROFILE}
    queue_url: ${CLOUDTRAIL_QUEUE_URL}
    bucket_role: ${CLOUDTRAIL_BUCKET_ROLE}
  github_audit:
    type: github_audit
    org: ${GITHUB_ORG}
    token: ${GITHUB_TOKEN}
  okta:
    type: okta
    org_url: ${OKTA_ORG_URL}
    token: ${OKTA_API_TOKEN}
  google_workspace:
    type: google_workspace
    credentials_file: ${GOOGLE_APPLICATION_CREDENTIALS}
    subject: ${GOOGLE_ADMIN_EMAIL}
  events:
    type: tcp
    bind_address: 0.0.0.0:9400

  buffer:
    type: store
    buffer_secs: 300
    grace_secs: 120

plugins:
  norm:
    module_type: rust
    path: norm
    data: profile
    tests:
      - input: tests/norm/input.json
        expected: tests/norm/expected.json
  enrich:
    module_type: rust
    path: ../../examples/enrich
    data: ../../examples/enrich/data
    config:
      fields: [_norm.ip]
      ours: [10.0.0.0/8]
  facts:
    module_type: rust
    path: facts
    data: profile
    tests:
      - input: tests/facts/input.json
        expected: tests/facts/expected.json
  novel:
    module_type: rust
    path: ../../examples/inference-local/novel
    tests:
      - input: tests/novel/input.json
        expected: tests/novel/expected.json
  flagged:
    module_type: rust
    path: ../../examples/inference-local/flagged

inference:
  judge:
    url: ${JUDGE_URL}
    model: ${JUDGE_MODEL}
    api_key: ${JUDGE_API_KEY}
    prompt_file: judge.md
    schema_file: judge.schema.json
    batch: 16
    batch_bytes: 16000
    context:
      scopes: { actor: _norm.actor, org: _norm.org }
      fields: [ts, source, _norm.kind, _norm.actor, _norm.ip, _norm.dest, _norm.target,
               _facts.ip.country, _facts.ip.org, _facts.ip.hosting, _facts.ip.tor, _facts.ip.vpn, _facts.ip.ours,
               _facts.principal, outcome.result, errorCode]
    max_tokens: 200
    temperature: 0.7
    timeout_ms: 90000
    concurrency: 4
    extra:
      top_p: 0.95
      chat_template_kwargs:
        enable_thinking: false

sinks:
  store:
    type: store
    recent: { actor: _norm.actor, org: _norm.org }
    novel:
      actor: [_norm.kind, _facts.ip.org, _facts.ip.country, _norm.dest, awsRegion, errorCode]
      org: [_norm.actor, _norm.dest, _norm.kind, _norm.target]
    follow: 1h
  alerts:
    type: file
    path: alerts.ndjson
    compression:
      type: none
  verdicts:
    type: file
    path: verdicts.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: cloudtrail }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: github_audit }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: okta }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: google_workspace }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: events }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: plugin, name: norm }
    to: [{ kind: plugin, name: enrich }]
  - from: { kind: plugin, name: enrich }
    to: [{ kind: plugin, name: facts }]
  - from: { kind: plugin, name: facts }
    to: [{ kind: sink, name: store }]
  - from: { kind: source, name: buffer }
    to: [{ kind: plugin, name: novel }]
  - from: { kind: plugin, name: novel }
    to: [{ kind: inference, name: judge }]
  - from: { kind: inference, name: judge }
    to: [{ kind: plugin, name: flagged }, { kind: sink, name: verdicts }]
  - from: { kind: plugin, name: flagged }
    to: [{ kind: sink, name: alerts }]
