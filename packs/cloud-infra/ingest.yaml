# cloud-infra, ingest: your own infrastructure's logs, every record kept in
# logs.sqlite by org and by actor. judge.yaml reads them back; nothing here
# waits on a model.
#
#   make setup      toolchain and the enrichment data (GeoLite2, cloud ranges, Tor exits)
#   make test       eight of the cases through norm and facts; no model needed
#   make run        ingest and the judge: reads CloudTrail, GitHub, Okta and Workspace for the
#                   credentials you export (see the Makefile); anything else as NDJSON on :9400
#
# Edit profile/profile.yaml first: it is everything the model knows about you.
runtime:
  workers: 2
  plugins_path: plugins/
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

sources:
  cloudtrail:
    type: cloudtrail
    region: ${AWS_REGION}
    profile: ${AWS_PROFILE}
    queue_url: ${CLOUDTRAIL_QUEUE_URL}
    bucket_role: ${CLOUDTRAIL_BUCKET_ROLE}
  github_audit:
    type: github_audit
    org: ${GITHUB_ORG}
    token: ${GITHUB_TOKEN}
  okta:
    type: okta
    org_url: ${OKTA_ORG_URL}
    token: ${OKTA_API_TOKEN}
  google_workspace:
    type: google_workspace
    credentials_file: ${GOOGLE_APPLICATION_CREDENTIALS}
    subject: ${GOOGLE_ADMIN_EMAIL}
  events:
    type: tcp
    bind_address: 0.0.0.0:9400

plugins:
  norm:
    module_type: rust
    path: norm
    data: profile
    tests:
      - input: tests/norm/input.json
        expected: tests/norm/expected.json
  enrich:
    module_type: rust
    path: ../../examples/enrich
    data: ../../examples/enrich/data
    config:
      fields: [_norm.ip]
      ours: [10.0.0.0/8]
  facts:
    module_type: rust
    path: facts
    data: profile
    tests:
      - input: tests/facts/input.json
        expected: tests/facts/expected.json

sinks:
  logs:
    type: sqlite
    path: logs.sqlite
    table: logs
    timestamp_key: ts
    partitions:
      org: [_norm.org]
      actor: [_norm.org, _norm.actor]

dag:
  - from: { kind: source, name: cloudtrail }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: github_audit }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: okta }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: google_workspace }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: source, name: events }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: plugin, name: norm }
    to: [{ kind: plugin, name: enrich }]
  - from: { kind: plugin, name: enrich }
    to: [{ kind: plugin, name: facts }]
  - from: { kind: plugin, name: facts }
    to: [{ kind: sink, name: logs }]
