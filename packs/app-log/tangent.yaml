# app-log: the product's logs, judged per customer. Same plugins as cloud-infra,
# partitioned by the customer's tenant id instead of folded into one org.
runtime:
  workers: 2
  plugins_path: plugins/
  partition:
    key: [_norm.org]            # the customer's tenant id, as norm extracts it from each source
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9401

  windows:                      # the stored records, read back a window at a time as each closes
    type: store
    span: 15m                   # one partition's quarter hour is judged together
    late: 20m                   # CloudTrail reports up to about fifteen minutes late
    grace: 2m                   # after a start, let the sources catch up before closing anything

plugins:
  norm:
    module_type: rust
    path: ../cloud-infra/norm
    data: profile               # org and own_sources are empty here: nothing is folded, every tenant is its own partition
  enrich:
    module_type: rust
    path: ../../examples/enrich
    data: ../../examples/enrich/data
    config:
      fields: [_norm.ip]
  facts:
    module_type: rust
    path: ../cloud-infra/facts
    data: profile               # one profile for every customer, until profiles live in the customer's partition
  flagged:
    module_type: rust
    path: ../../examples/inference-local/flagged

inference:
  judge:
    backend: openai
    url: ${JUDGE_URL}
    model: ${JUDGE_MODEL}
    api_key: ${JUDGE_API_KEY}
    prompt_file: ../cloud-infra/judge.md
    schema_file: ../cloud-infra/judge.schema.json      # the shape, enforced by the backend where it can
    batch: 16                   # records per request, as many as fit batch_bytes; the model judges them together
    batch_bytes: 16000          # one local model's comfortable prompt; raise it for a hosted model
    context:                    # the history before a window, read from the store once per request
      scopes: { actor: _norm.actor, org: _norm.org }
      spans: { actor: 24h, org: 1h }
      max_events: 20
      fields: [ts, source, _norm.kind, _norm.actor, _norm.ip, _norm.dest, _norm.target,
               _facts.ip.country, _facts.ip.org, _facts.ip.hosting, _facts.ip.tor, _facts.ip.vpn, _facts.ip.ours,
               _facts.principal, outcome.result, errorCode]
    max_tokens: 200             # per record; a batch may say batch times as much
    timeout_ms: 90000
    concurrency: 4
    extra:
      chat_template_kwargs:
        enable_thinking: false

sinks:
  store:                        # every normalized, enriched record, per partition: what windows and history are read from
    type: store
    retain: 30d
  alerts:
    type: file
    path: alerts.ndjson
    compression:
      type: none
  verdicts:
    type: file
    path: verdicts.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: events }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: plugin, name: norm }
    to: [{ kind: plugin, name: enrich }]
  - from: { kind: plugin, name: enrich }
    to: [{ kind: plugin, name: facts }]
  # 1. ingest: normalized, enriched, kept
  - from: { kind: plugin, name: facts }
    to: [{ kind: sink, name: store }]
  # 2. judgment: a window at a time, read back from the store
  - from: { kind: source, name: windows }
    to: [{ kind: inference, name: judge }]
  - from: { kind: inference, name: judge }
    to: [{ kind: plugin, name: flagged }, { kind: sink, name: verdicts }]
  - from: { kind: plugin, name: flagged }
    to: [{ kind: sink, name: alerts }]
