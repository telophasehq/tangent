# app-log: the product's logs, judged per customer. Same plugins as cloud-infra;
# the customer's tenant id is the org, so each customer's actors are their own.
runtime:
  workers: 1
  plugins_path: plugins/
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9401

  actors:
    type: sqlite
    path: logs.sqlite
    partition: actor
    window_secs: 300

plugins:
  norm:
    module_type: rust
    path: ../cloud-infra/norm
    data: profile
  enrich:
    module_type: rust
    path: ../../examples/enrich
    data: ../../examples/enrich/data
    config:
      fields: [_norm.ip]
  facts:
    module_type: rust
    path: ../cloud-infra/facts
    data: profile
  flagged:
    module_type: rust
    path: ../../examples/inference-local/flagged

inference:
  judge:
    url: ${JUDGE_URL}
    model: ${JUDGE_MODEL}
    api_key: ${JUDGE_API_KEY}
    prompt_file: ../cloud-infra/judge.md
    schema_file: ../cloud-infra/judge.schema.json
    group_by: [_norm.org, _norm.actor]
    batch: 16
    batch_bytes: 16000
    max_tokens: 200
    temperature: 0.7
    timeout_ms: 90000
    concurrency: 4
    extra:
      top_p: 0.95
      chat_template_kwargs:
        enable_thinking: false

sinks:
  logs:
    type: sqlite
    path: logs.sqlite
    time: ts
    partitions:
      org: [_norm.org]
      actor: [_norm.org, _norm.actor]
  alerts:
    type: file
    path: alerts.ndjson
    compression:
      type: none
  verdicts:
    type: file
    path: verdicts.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: events }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: plugin, name: norm }
    to: [{ kind: plugin, name: enrich }]
  - from: { kind: plugin, name: enrich }
    to: [{ kind: plugin, name: facts }]
  - from: { kind: plugin, name: facts }
    to: [{ kind: sink, name: logs }]
  - from: { kind: source, name: actors }
    to: [{ kind: inference, name: judge }]
  - from: { kind: inference, name: judge }
    to: [{ kind: plugin, name: flagged }, { kind: sink, name: verdicts }]
  - from: { kind: plugin, name: flagged }
    to: [{ kind: sink, name: alerts }]
