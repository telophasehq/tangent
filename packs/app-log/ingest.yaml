# app-log, ingest: the product's logs into logs.sqlite. Same plugins as
# cloud-infra; the customer's tenant id is the org, so each customer's actors
# are their own. judge.yaml reads them back.
runtime:
  workers: 2
  plugins_path: plugins/
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9401

plugins:
  norm:
    module_type: rust
    path: ../cloud-infra/norm
    data: profile
  enrich:
    module_type: rust
    path: ../../examples/enrich
    data: ../../examples/enrich/data
    config:
      fields: [_norm.ip]
  facts:
    module_type: rust
    path: ../cloud-infra/facts
    data: profile

sinks:
  logs:
    type: sqlite
    path: logs.sqlite
    table: logs
    time: ts
    partitions:
      org: [_norm.org]
      actor: [_norm.org, _norm.actor]

dag:
  - from: { kind: source, name: events }
    to: [{ kind: plugin, name: norm }]
  - from: { kind: plugin, name: norm }
    to: [{ kind: plugin, name: enrich }]
  - from: { kind: plugin, name: enrich }
    to: [{ kind: plugin, name: facts }]
  - from: { kind: plugin, name: facts }
    to: [{ kind: sink, name: logs }]
