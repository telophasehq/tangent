# core, judge: a model reads each actor's latest forty records from
# logs.sqlite and writes a verdict per new one; a person reads the ones it
# flagged. One worker, so an actor's records reach the model together. Include
# it in your judge config with the packs' judge.yaml.
runtime:
  workers: 1
  plugins_path: plugins/
  state:
    backend: lru

sources:
  actors:
    type: sqlite
    path: logs.sqlite
    table: logs
    partition: actor
    batch_size: 40
    timeout_secs: 3600

plugins:
  fresh:
    module_type: rust
    path: fresh
  flagged:
    module_type: rust
    path: ../../examples/inference-local/flagged

inference:
  judge:
    url: ${JUDGE_URL:-http://localhost:8080/v1}
    model: ${JUDGE_MODEL:-glm-4.7-flash}
    api_key: ${JUDGE_API_KEY:-none}
    prompt_file: judge.md
    schema_file: judge.schema.json
    group_by: [_norm.org, _norm.actor]
    batch_bytes: 48000
    max_tokens: 200
    temperature: 0.7
    timeout_ms: 90000
    concurrency: 4
    extra:
      top_p: 0.95
      chat_template_kwargs:
        enable_thinking: false
    # JSON lines. `type: logfmt` writes the records as logfmt lines instead,
    # about half the tokens and nothing lost: the fields in `keep` on every
    # line, the rest a principal's records share written once, each source as
    # its pack's judge.yaml says. Measured with Claude Haiku 5.5 only, where it
    # caught what JSON caught. `keep` holds what every pack writes; a pack's
    # own `_facts` go in its sources' `keep`, as packs/aws/judge.yaml's do.
    encoding:
      type: ndjson
      keep: [_context, _norm.actor, _norm.kind, _norm.target, _norm.dest, _facts.principal, _facts.watch, _facts.sensitive_target, _facts.key_known_network, _facts.ip.tor, _facts.ip.vpn]

sinks:
  alerts:
    type: file
    path: alerts.ndjson
    compression:
      type: none
  verdicts:
    type: file
    path: verdicts.ndjson
    compression:
      type: none

dag:
  - from: { kind: source, name: actors }
    to: [{ kind: inference, name: judge }]
  - from: { kind: inference, name: judge }
    to: [{ kind: plugin, name: fresh }]
  - from: { kind: plugin, name: fresh }
    to: [{ kind: plugin, name: flagged }, { kind: sink, name: verdicts }]
  - from: { kind: plugin, name: flagged }
    to: [{ kind: sink, name: alerts }]
