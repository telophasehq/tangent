# core, judge: a model reads each actor's records a group at a time, with
# what baseline_builder knew of the actor before them, and writes a verdict
# per new one; a person reads the ones it flagged. Include it in your config
# with core's ingest.yaml and the packs' ingest.yaml and judge.yaml.
plugins:
  baseline_renderer:             # the same `_baseline` on each of an actor's records
    module_type: rust
    path: baseline/renderer
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
    state_namespace: baseline
    drop_on_error: false         # no `_baseline` rather than no verdict
    # Every pack's plugin has an edge here. An actor's records wait in a group
    # and reach the renderer, then the model, together, on workers of their
    # own, so ingest never waits on the model (README.md#baseline).
    group_by: [_norm.org, _norm.actor]
    max_events: 30               # with the ten below, the forty `batch_bytes` fits in one request
    max_age_ms: 3600000          # or an hour after its first record, however busy the actor
    expire_after_ms: 3600000     # an hour's quiet too, not the 30 s default: fuller groups, fewer requests
    history: 10                  # the actor's latest ten records again, as `_context`
  fresh:
    module_type: rust
    path: fresh
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
  flagged:
    module_type: rust
    path: ../../examples/inference-local/flagged
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)

inference:
  judge:
    url: ${JUDGE_URL:-http://localhost:8080/v1}
    model: ${JUDGE_MODEL:-glm-4.7-flash}
    api_key: ${JUDGE_API_KEY:-none}
    prompt_file: judge.md
    schema_file: judge.schema.json
    group_by: [_norm.org, _norm.actor]
    batch_bytes: 96000           # JSON bytes, `_baseline` counted on every record though logfmt writes it once: an actor's forty fit
    max_tokens: 200
    temperature: 0.7
    timeout_ms: 90000
    concurrency: 4
    extra:
      top_p: 0.95
      chat_template_kwargs:
        enable_thinking: false
    # logfmt lines, about half the tokens of JSON lines and nothing lost: the
    # fields in `keep` on every line, the rest a principal's records share
    # written once (`_baseline` among them), each source as its pack's
    # judge.yaml says. Measured with Claude Haiku 5.5, where it caught what
    # JSON caught. `type: ndjson` sends JSON lines instead, `_baseline` on
    # every one: three times the tokens, so `batch_bytes: 48000` with it
    # (README.md). `keep` holds what every pack writes; a pack's own `_facts`
    # go in its sources' `keep`, as packs/aws/judge.yaml's do.
    encoding:
      type: logfmt
      keep: [_context, _norm.actor, _norm.kind, _norm.target, _norm.dest, _facts.principal, _facts.watch, _facts.sensitive_target, _facts.key_known_network, _facts.ip.tor, _facts.ip.vpn]

sinks:
  alerts:
    type: file
    path: alerts.ndjson
    compression:
      type: none
  verdicts:
    type: file
    path: verdicts.ndjson
    compression:
      type: none

dag:
  - from: { kind: plugin, name: baseline_renderer }
    to: [{ kind: inference, name: judge }]
  - from: { kind: inference, name: judge }
    to: [{ kind: plugin, name: fresh }]
  - from: { kind: plugin, name: fresh }
    to: [{ kind: plugin, name: flagged }, { kind: sink, name: verdicts }]
  - from: { kind: plugin, name: flagged }
    to: [{ kind: sink, name: alerts }]
