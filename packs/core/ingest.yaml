# core, ingest: what every pack's plugin reads and where its records go. Not a
# provider: include it, with core's judge.yaml and the packs you want, in your
# config, which names your sources, routes each to its pack, and gives the
# `profile` table (README.md).
runtime:
  # workers: one per CPU, the default (README.md)
  plugins_path: plugins/
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

# Read once for the process and shared by every pack's plugin, however many are
# included. examples/enrich/setup.sh fetches them; a missing file is a warning,
# and its fields are left out.
enrichment_tables:
  geo: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-Country.mmdb }
  asn: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-ASN.mmdb }
  networks: { type: cidr, path: ../../examples/enrich/data/networks.csv }

# Every pack's plugin has an edge here too, beside the ones to `lake` and
# judge.yaml's baseline_renderer: baseline_builder folds each record into
# state.sqlite, what each actor did and from where, which baseline_renderer
# reads before the model sees the actor.
plugins:
  baseline_builder:              # folds every record into state; emits nothing
    module_type: rust
    path: baseline/builder
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
    state_namespace: baseline

# Every pack's plugin has an edge to it.
sinks:
  lake:                          # every finished record, kept: Parquet files, a directory an hour; delete old hours to trim it
    type: rolling_file
    path: lake/logs/%Y/%m/%d/%H
    wal_path: lake/wal
    max_file_age_seconds: 3600
    compression: { type: zstd, level: 3 }
    encoding:
      type: parquet
      record_column: record      # each record whole, for the fields the schema leaves out
      schema:
        ts: timestamp
        source: string
        _norm: { org: string, actor: string, kind: string, ip: string }
