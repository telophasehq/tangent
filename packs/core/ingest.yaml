# core, ingest: what every pack's plugin reads and where its records go. Not a
# provider: include it in your ingest config with the packs you want. That
# config names your sources, routes each to its pack, and gives the `profile`
# table (README.md).
runtime:
  workers: 1                     # history's one writer: keep it, and add no `partition` (README.md)
  plugins_path: plugins/
  state:
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0

# Read once for the process and shared by every pack's plugin, however many are
# included. examples/enrich/setup.sh fetches them; a missing file is a warning,
# and its fields are left out.
enrichment_tables:
  geo: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-Country.mmdb }
  asn: { type: mmdb, path: ../../examples/enrich/data/GeoLite2-ASN.mmdb }
  networks: { type: cidr, path: ../../examples/enrich/data/networks.csv }

# Every pack's plugin has an edge here too, beside the one to `logs`: history
# folds each record into state.sqlite, what each actor did and from where,
# which judge.yaml's history reads before the model sees the actor.
plugins:
  history:
    module_type: rust
    path: history
    state_namespace: history
    config:
      mode: learn                # folds every record into state; emits nothing

# Every pack's plugin has an edge here.
sinks:
  logs:
    type: sqlite
    path: logs.sqlite
    table: logs
    timestamp_key: ts
    partitions:
      org: [_norm.org]
      actor: [_norm.org, _norm.actor]
