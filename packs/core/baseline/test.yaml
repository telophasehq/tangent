# baseline alone in `mode: both`: each record's `_baseline` is what the records
# before it taught, as ingest's learn and the judge's header see it. Every
# record is over half the test runner's 1 KB batch, so each is a call of its
# own. `make -C packs test-baseline` runs it.
runtime:
  plugins_path: plugins/
  state:
    backend: lru
    default_ttl_ms: 0
    max_ttl_ms: 0

plugins:
  baseline:
    module_type: rust
    path: .
    state_namespace: baseline
    config:
      mode: both
    tests:
      - input: tests/input.json
        expected: tests/expected.json
        enrichment_tables:
          profile: { type: document, path: tests/profile.yaml }   # people: dave is dave@acme.io
