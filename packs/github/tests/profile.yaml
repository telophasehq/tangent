# The company in the github fixtures (examples/cloud-infra's fictional one),
# cut to what tests/expected.json turns on. The fixtures' test reads it as its
# `profile` table (ingest.yaml), in any config that includes this pack.
# packs/core/README.md lists every key.

countries: [US]                  # where your people sign in from

members:                         # people: identity-provider emails and GitHub handles
  - dev-sam

people:                          # one person under each name the sources give them: IAM users, GitHub handles
  sam@acme.io: [dev-sam]

hosts:                           # hosts your systems talk to (*.suffix allowed)
  - github.com
  - ghcr.io
