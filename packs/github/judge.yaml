# github, judge: how the judge writes GitHub's audit log, CI and runner egress
# records as logfmt, once packs/core/judge.yaml's encoding is `type: logfmt`:
# the fields naming the principal and the time, and those the model sees on
# every line. Include it in a judge config with packs/core/judge.yaml.
inference:
  judge:
    encoding:
      sources:
        github_audit:
          principal: [_norm.actor, actor]
          time: ["@timestamp", created_at, ts]
          keep: [action, repo, visibility, permission, programmatic_access_type, token_scopes, operation_type]
        gha_ci: { principal: [_norm.actor, actor], time: [ts] }
        runner_egress: { principal: [_norm.actor, actor], time: [ts] }
