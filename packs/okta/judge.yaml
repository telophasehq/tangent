# okta, judge: how the judge writes Okta's records as logfmt, the encoding
# packs/core/judge.yaml sets: the fields naming the principal and the time,
# and those the model sees on every line. Include it in a judge config with
# packs/core/judge.yaml.
inference:
  judge:
    encoding:
      sources:
        okta:
          principal: [_norm.actor, actor.alternateId]
          time: [published, ts]
          keep: [eventType, outcome, target, authenticationContext.credentialType, securityContext.isProxy, debugData.threatSuspected]
