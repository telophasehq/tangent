# app, judge: how the judge writes the audit log's records as logfmt, the
# encoding packs/core/judge.yaml sets: the fields naming the principal and the
# time, and those the model sees on every line. The agent's records have no
# row; they go without principal groups. A name of yours under `sources` or
# `extra_sources` wants a row of its own, as `app` has. Include it in a judge
# config with packs/core/judge.yaml.
inference:
  judge:
    encoding:
      sources:
        app: { principal: [_norm.actor, actor], time: [ts] }
