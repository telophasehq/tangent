# The company in the google_workspace fixtures (examples/cloud-infra's
# fictional one), cut to what tests/expected.json turns on. The fixtures' test
# reads it as its `profile` table (ingest.yaml), in any config that includes
# this pack. packs/core/README.md lists every key.

org: acme                        # the org every one of your own infrastructure logs is folded into
own_sources: [google_workspace]

countries: [US]                  # where your people sign in from

members:                         # people: identity-provider emails and GitHub handles
  - cfo@acme.io

watch:                           # kinds a person wants seen every time, however usual
  - EMAIL_FORWARDING_OUT_OF_DOMAIN     # Google Workspace
