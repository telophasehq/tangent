[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
bin-dist = ["tangent"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu",  "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# CI backends to support
ci = "github"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.0"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "telophasehq/homebrew-telophase"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI: Homebrew, then the packs' components attested and
# each bundle uploaded beside its component, for `tangent plugin fetch`
# (.github/workflows/attest-packs.yml)
publish-jobs = ["homebrew", "./attest-packs"]
github-custom-job-permissions = { attest-packs = { contents = "write", id-token = "write", attestations = "write" } }
# Whether to install an updater program
install-updater = false
# Every binary attested with GitHub's artifact attestations
github-attestations = true

# The packs' plugins, compiled once here and run anywhere: release artifacts
# beside the binaries (packs/dist.sh builds them; its list and this one agree)
[[dist.extra-artifacts]]
artifacts = [
  "target/packs/cloudtrail.component.wasm",
  "target/packs/github.component.wasm",
  "target/packs/okta.component.wasm",
  "target/packs/google_workspace.component.wasm",
  "target/packs/baseline_builder.component.wasm",
  "target/packs/baseline_renderer.component.wasm",
  "target/packs/fresh.component.wasm",
  "target/packs/flagged.component.wasm",
]
build = ["bash", "packs/dist.sh"]
